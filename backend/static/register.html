<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up — WheelWise PK</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("pakwheels_theme");
          if (s === "dark") document.documentElement.classList.add("dark");
          else if (s === "light") document.documentElement.classList.remove("dark");
          else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/site.css" />
  </head>
  <body class="min-h-full bg-slate-100 text-slate-900 antialiased dark:bg-zinc-900 dark:text-zinc-100" data-ww-layout>

    <div id="site-nav" data-page="register"></div>

    <main class="flex min-h-[calc(100vh-4.25rem)] items-center justify-center px-4 py-12">
      <div class="w-full max-w-md animate-fade-in">
        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg dark:border-zinc-800 dark:bg-zinc-900">
          <p class="mb-2 text-center text-xs font-semibold uppercase tracking-widest text-violet-600 dark:text-violet-400">Get started</p>
          <h1 class="text-center text-2xl font-bold text-slate-900 dark:text-white">Create account</h1>
          <p class="mt-2 text-center text-sm text-slate-600 dark:text-zinc-400">Choose your account type, then complete your profile.</p>

          <form id="register-form" class="mt-8 space-y-4">
            <fieldset class="space-y-2">
              <legend class="text-sm font-medium text-slate-700 dark:text-zinc-300">Account type</legend>
              <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-300 p-3 transition has-[:checked]:border-violet-500 has-[:checked]:bg-violet-500/5 dark:border-zinc-700 dark:has-[:checked]:border-violet-500/60 dark:has-[:checked]:bg-violet-950/30">
                <input type="radio" name="account_type" value="seller" checked class="mt-1 text-violet-600" />
                <span>
                  <span class="block text-sm font-semibold text-slate-900 dark:text-white">Sell your car</span>
                  <span class="mt-0.5 block text-xs text-slate-600 dark:text-zinc-400">List vehicles for sale with AI-powered ads.</span>
                </span>
              </label>
              <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-slate-300 p-3 transition has-[:checked]:border-violet-500 has-[:checked]:bg-violet-500/5 dark:border-zinc-700 dark:has-[:checked]:border-violet-500/60 dark:has-[:checked]:bg-violet-950/30">
                <input type="radio" name="account_type" value="rental_partner" class="mt-1 text-violet-600" />
                <span>
                  <span class="block text-sm font-semibold text-slate-900 dark:text-white">Rent your car</span>
                  <span class="mt-0.5 block text-xs text-slate-600 dark:text-zinc-400">Join as a rental partner on the rent-a-car vertical.</span>
                </span>
              </label>
            </fieldset>
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="email">Email</label>
              <input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
            </div>
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="username">Username</label>
              <input id="username" type="text" required pattern="[a-z0-9_]{3,32}" autocomplete="username" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
              <p class="mt-1 text-xs text-slate-500 dark:text-zinc-500">Lowercase letters, numbers, underscore (3–32 chars).</p>
            </div>
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="full_name">Full name <span class="font-normal text-slate-400">(optional)</span></label>
              <input id="full_name" type="text" autocomplete="name" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
            </div>
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="password">Password</label>
              <input id="password" type="password" required minlength="8" autocomplete="new-password" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
            </div>
            <button id="register-submit" type="submit" class="w-full rounded-xl bg-gradient-to-br from-violet-500 to-violet-700 py-3 text-sm font-semibold text-white shadow-md hover:from-violet-400">Create account</button>
          </form>
          <p id="register-error" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300"></p>
          <p class="mt-6 text-center text-sm text-slate-500 dark:text-zinc-400">
            Have an account?
            <a href="/login" class="font-semibold text-violet-600 hover:underline dark:text-violet-400">Sign in</a>
          </p>
        </div>
      </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/register.js"></script>
  </body>
</html>
