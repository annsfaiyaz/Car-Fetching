<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — WheelWise PK</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("pakwheels_theme");
          if (s === "dark") document.documentElement.classList.add("dark");
          else if (s === "light") document.documentElement.classList.remove("dark");
          else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/site.css" />
  </head>
  <body class="min-h-full bg-slate-100 text-slate-900 antialiased dark:bg-zinc-900 dark:text-zinc-100" data-ww-layout>

    <div id="site-nav" data-page="login"></div>

    <main class="flex min-h-[calc(100vh-4.25rem)] items-center justify-center px-4 py-12">
      <div class="ww-page-hero w-full max-w-md animate-fade-in">
        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg dark:border-zinc-800 dark:bg-zinc-900">
          <p class="mb-2 text-center text-xs font-semibold uppercase tracking-widest text-violet-600 dark:text-violet-400">Welcome back</p>
          <h1 class="text-center text-2xl font-bold text-slate-900 dark:text-white">Sign in</h1>
          <p class="mt-2 text-center text-sm text-slate-600 dark:text-zinc-400">Publish and manage your car ads on WheelWise PK.</p>
          <form id="login-form" class="mt-8 space-y-4">
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="email">Email</label>
              <input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
            </div>
            <div>
              <label class="text-sm font-medium text-slate-700 dark:text-zinc-300" for="password">Password</label>
              <input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" />
            </div>
            <button id="login-submit" type="submit" class="w-full rounded-xl bg-gradient-to-br from-violet-500 to-violet-700 py-3 text-sm font-semibold text-white shadow-md hover:from-violet-400">Sign in</button>
          </form>
          <p id="login-error" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300"></p>
          <div class="mt-6 border-t border-slate-200 pt-6 dark:border-zinc-700">
            <p class="text-center text-sm text-slate-600 dark:text-zinc-400">Don&apos;t have an account?</p>
            <a
              href="/register"
              class="mt-3 flex w-full items-center justify-center rounded-xl border border-violet-300 bg-violet-500/5 px-4 py-3 text-sm font-semibold text-violet-700 transition hover:bg-violet-500/10 dark:border-violet-500/40 dark:text-violet-300 dark:hover:bg-violet-500/15"
              >Sign up free</a
            >
          </div>
        </div>
      </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
