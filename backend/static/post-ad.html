<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post an Ad — WheelWise PK</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("pakwheels_theme");
          if (s === "dark") document.documentElement.classList.add("dark");
          else if (s === "light") document.documentElement.classList.remove("dark");
          else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] } } } };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/site.css" />
  </head>
  <body class="min-h-full bg-slate-100 text-slate-900 antialiased dark:bg-zinc-900 dark:text-zinc-100" data-ww-layout>

    <div id="site-nav" data-page="post-ad"></div>

    <section class="ww-page-hero px-4 pb-2 pt-6 text-center sm:pt-10">
      <p id="page-badge" class="mb-3 inline-flex items-center gap-2 rounded-full border border-emerald-300/40 bg-emerald-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-emerald-800 dark:border-emerald-500/30 dark:text-emerald-300">
        Review &amp; publish
      </p>
      <h1 id="page-heading" class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Confirm your listing</h1>
      <p id="page-sub" class="mx-auto mt-3 max-w-xl text-base text-slate-600 dark:text-zinc-400">
        Check what AI detected, add price and city, edit anything, then publish when you are ready.
      </p>
    </section>

    <main class="mx-auto max-w-3xl px-4 pb-16 lg:px-6">
      <div id="ai-banner" class="mb-6 flex gap-3 rounded-xl border border-violet-300/50 bg-violet-500/10 px-4 py-3 text-sm text-violet-900 dark:border-violet-600/40 dark:text-violet-200">
        <svg class="h-5 w-5 shrink-0 text-violet-600 dark:text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
        <span>Fields were pre-filled from AI photo analysis. Edit anything before publishing.</span>
      </div>

      <form id="post-ad-form" class="animate-fade-in rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-8">
        <input type="hidden" id="field-image-url" />
        <div class="mb-6 sm:col-span-2">
          <img id="preview-image" class="hidden max-h-56 w-full rounded-xl border border-slate-200 object-cover dark:border-zinc-700" alt="Car preview" />
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label class="text-sm font-medium text-slate-700 dark:text-zinc-300">Title *</label>
            <input id="field-title" required class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-500/20 dark:border-zinc-700 dark:bg-zinc-800" />
          </div>
          <div><label class="text-sm font-medium">Make</label><input id="field-make" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Model</label><input id="field-model" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Variant</label><input id="field-variant" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Year</label><input id="field-year" type="number" min="1980" max="2030" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Price (PKR)</label><input id="field-price" type="number" min="0" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">City</label><input id="field-city" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Body type</label><input id="field-body" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Color</label><input id="field-color" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Transmission</label><input id="field-transmission" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Fuel</label><input id="field-fuel" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Mileage (km)</label><input id="field-mileage" type="number" min="0" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div><label class="text-sm font-medium">Condition</label><input id="field-condition" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm dark:border-zinc-700 dark:bg-zinc-800" /></div>
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">Description</label>
            <textarea id="field-description" rows="5" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm dark:border-zinc-700 dark:bg-zinc-800"></textarea>
          </div>
          <div class="sm:col-span-2 pt-2">
            <button type="submit" id="btn-publish" class="w-full rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 px-6 py-3.5 text-sm font-semibold text-white shadow-md shadow-emerald-500/20 hover:from-emerald-400">
              Confirm &amp; publish
            </button>
          </div>
        </div>
      </form>
      <div id="post-status" class="hidden mt-4" role="status"></div>
      <p id="sell-hint" class="mt-6 text-center text-sm text-slate-500 dark:text-zinc-500">
        No AI data yet? <a href="/sell" class="font-semibold text-violet-600 hover:underline dark:text-violet-400">Upload photos first →</a>
        · <a href="/my-ads" class="font-semibold text-slate-600 hover:underline dark:text-zinc-400">My ads</a>
      </p>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/post-ad.js"></script>
  </body>
</html>
